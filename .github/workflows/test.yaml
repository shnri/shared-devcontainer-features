name: Test Features

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: |
          npm install --global @devcontainers/cli@0.88.0
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate shell scripts
        run: shellcheck src/**/*.sh test/**/*.sh

      - name: Package Features
        run: devcontainer features package ./src --output-folder ./output

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Test default Feature
        run: >-
          devcontainer features test
          --features web-dev
          --base-image mcr.microsoft.com/devcontainers/base:2.1.13-bookworm
          --remote-user vscode
          --skip-scenarios
          .

      - name: Test Feature scenarios
        run: >-
          devcontainer features test
          --features web-dev
          --skip-autogenerated
          --skip-duplicated
          .
