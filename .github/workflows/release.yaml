name: Release Features

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: |
          npm install --global @devcontainers/cli@0.88.0
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check tag and Feature version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          feature_version="$(node -p "require('./src/web-dev/devcontainer-feature.json').version")"
          test "${RELEASE_TAG}" = "v${feature_version}"

      - name: Validate shell scripts
        run: shellcheck src/**/*.sh test/**/*.sh

      - name: Package Features
        run: devcontainer features package ./src --output-folder ./output

      - name: Test default Feature
        run: >-
          devcontainer features test
          --features web-dev
          --base-image mcr.microsoft.com/devcontainers/base:2.1.13-bookworm
          --remote-user vscode
          --skip-scenarios
          .

      - name: Test Feature scenarios
        run: >-
          devcontainer features test
          --features web-dev
          --skip-autogenerated
          --skip-duplicated
          .

      - name: Publish Features
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.3
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "false"
          disable-repo-tagging: "true"
          devcontainer-cli-version: "0.88.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
